; CPU thread cap as a percent of logical processors.
; Possible values: 1 to 100
; Used only for CPU presets (not CUDA / NVENC).
cpu_percent=75

; Windows priority for the ffmpeg.exe process.
; Possible values: Idle, BelowNormal, Normal, AboveNormal, High
; BelowNormal is recommended so the desktop stays responsive.
priority=BelowNormal
