pre=-hwaccel cuda
args=-vf crop='if(gt(iw/ih,16/9),ih*16/9,iw)':'if(gt(iw/ih,16/9),ih,iw*9/16)':'(iw-ow)/2':'(ih-oh)/2',scale=-2:720:flags=lanczos,format=p010le -c:v av1_nvenc -preset p7 -tune hq -multipass fullres -rc vbr -cq 34 -b:v 0 -maxrate 2.5M -bufsize 5M -rc-lookahead 32 -spatial-aq 1 -aq-strength 8 -bf 4 -g 240 -r 30 -c:a aac -b:a 128k -ar 48000 -movflags +faststart
suffix=.nvidia720p169
ext=mp4
note=Crop Any Videos to Match 16/9 Screen Ratios, with Best quality and file size possible 

[NVIDIA MP4 Portrait/Mobile 1080x1920]
pre=-hwaccel cuda
args=-vf crop=ih*9/16:ih:(iw-ih*9/16)/2:0,scale=1080:1920:flags=lanczos,format=p010le -c:v av1_nvenc -preset p7 -tune hq -multipass fullres -rc vbr -cq 34 -b:v 0 -maxrate 4M -bufsize 8M -rc-lookahead 32 -spatial-aq 1 -aq-strength 8 -bf 4 -g 240 -r 30 -c:a aac -b:a 160k -ar 48000 -movflags +faststart
suffix=.nvidia1080Portrait
ext=mp4
note=Crop Any Videos from the center to Portrait (Mobile Screens)

