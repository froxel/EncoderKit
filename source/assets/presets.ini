[Remove audio (copy video)]
note=No re-encode. Copies video as-is and drops all audio. Keeps the original container.
pre=
args=-c copy -an
suffix=.mute
ext=*

[MP3 audio only]
pre=
args=-vn -map 0:a:0 -c:a libmp3lame -q:a 2
suffix=
ext=mp3
note= Audio Only files

[JPEG 1 frame per second]
note=Saves one JPEG every second into a folder named videoname-frames.
pre=
args=-r 1
suffix=-frames\%04d
ext=jpeg