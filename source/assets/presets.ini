[NVIDIA MP4 2K 1440p]
pre=-hwaccel cuda -hwaccel_output_format cuda
args=-vf scale_cuda=-2:1440:format=p010le:interp_algo=lanczos -c:v av1_nvenc -preset p7 -tune hq -multipass fullres -rc vbr -cq 34 -b:v 0 -maxrate 7M -bufsize 14M -rc-lookahead 32 -spatial-aq 1 -aq-strength 8 -bf 4 -g 240 -r 30 -c:a aac -b:a 160k -ar 48000 -movflags +faststart
suffix=.nvidia1440p
ext=mp4
note=Scale to 2k/1440p with Best quality and file size possible

[NVIDIA MP4 Full HD 1080p]
pre=-hwaccel cuda -hwaccel_output_format cuda
args=-vf scale_cuda=-2:1080:format=p010le:interp_algo=lanczos -c:v av1_nvenc -preset p7 -tune hq -multipass fullres -rc vbr -cq 34 -b:v 0 -maxrate 4M -bufsize 8M -rc-lookahead 32 -spatial-aq 1 -aq-strength 8 -bf 4 -g 240 -r 30 -c:a aac -b:a 160k -ar 48000 -movflags +faststart
suffix=.nvidia1080p
ext=mp4
note=Scale to Full-HD/1080p with Best quality and file size possible

[NVIDIA MP4 HD 720p]
pre=-hwaccel cuda -hwaccel_output_format cuda
args=-vf scale_cuda=-2:720:format=p010le:interp_algo=lanczos -c:v av1_nvenc -preset p7 -tune hq -multipass fullres -rc vbr -cq 34 -b:v 0 -maxrate 2.5M -bufsize 5M -rc-lookahead 32 -spatial-aq 1 -aq-strength 8 -bf 4 -g 240 -r 30 -c:a aac -b:a 128k -ar 48000 -movflags +faststart
suffix=.nvidia720p
ext=mp4
note=Scale to HD/720p with Best quality and file size possible

[NVIDIA MP4 Crop To Full HD 16/9]
pre=-hwaccel cuda
args=-vf crop='if(gt(iw/ih,16/9),ih*16/9,iw)':'if(gt(iw/ih,16/9),ih,iw*9/16)':'(iw-ow)/2':'(ih-oh)/2',scale=-2:1080:flags=lanczos,format=p010le -c:v av1_nvenc -preset p7 -tune hq -multipass fullres -rc vbr -cq 34 -b:v 0 -maxrate 4M -bufsize 8M -rc-lookahead 32 -spatial-aq 1 -aq-strength 8 -bf 4 -g 240 -r 30 -c:a aac -b:a 160k -ar 48000 -movflags +faststart
suffix=.nvidia1080p169
ext=mp4
note=Crop Any Videos to Match 16/9 Screen Ratios, with Best quality and file size possible 

